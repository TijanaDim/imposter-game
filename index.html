
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Imposter Game</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    .hidden { display: none; }
    .block { margin-top: 20px; }
    button { padding: 10px 20px; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>Imposter Game</h1>

  <!-- Screen 1: Select Player -->
  <div id="screen1">
    <label for="player">Select your name:</label>
    <select id="player">
      <option value="">-- Choose player --</option>
      <option value="Nikita">Nikita</option>
      <option value="Andrej">Andrej</option>
      <option value="Stefanija">Stefanija</option>
      <option value="Tijana">Tijana</option>
      <option value="Tamara">Tamara</option>
    </select>
    <button onclick="startGame()">Continue</button>
  </div>

  <!-- Screen 2: Player gets question -->
  <div id="screen2" class="hidden">
    <h2>Question <span id="questionNumber">1</span></h2>
    <p id="playerQuestionEn"></p>
    <p><i id="playerQuestionMk"></i></p>
    <button onclick="revealShared()">Next</button>
  </div>

  <!-- Screen 3: Shared question (non-imposter version) -->
  <div id="screen3" class="hidden">
    <h3>This is the question most players received:</h3>
    <p id="sharedQuestionEn"></p>
    <p><i id="sharedQuestionMk"></i></p>
    <button onclick="nextRound()">Continue to Next Question</button>
  </div>

<script>
const players = ["Nikita", "Andrej", "Stefanija", "Tijana", "Tamara"];
let playerName = "";
let currentIndex = 0;

// 30 questions: { common, mk, imposter, imposterMk }
const questions = [{"common": "What's your favorite fruit?", "mk": "Кое е твоето омилено овошје?", "imposter": "What's your least favorite fruit?", "imposterMk": "Кое овошје најмалку го сакаш?"}, {"common": "At what age would you like to retire?", "mk": "На која возраст би сакал да се пензионираш?", "imposter": "At what age would you like to start working?", "imposterMk": "На која возраст би сакал да почнеш да работиш?"}, {"common": "How much would someone have to pay you to shave your head?", "mk": "Колку би требало некој да ти плати за да ја избричиш главата?", "imposter": "How much would you pay someone to shave your head?", "imposterMk": "Колку би платил некој да ти ја избричи главата?"}, {"common": "What's a movie you love?", "mk": "Кој е филм што го сакаш?", "imposter": "What's a movie you dislike?", "imposterMk": "Кој е филм што не го сакаш?"}, {"common": "What's your dream travel destination?", "mk": "Која е твојата дестинација од соништата?", "imposter": "Where would you never want to travel?", "imposterMk": "Каде никогаш не би сакал да патуваш?"}];

function startGame() {
  const select = document.getElementById("player");
  playerName = select.value;
  if (!playerName) return alert("Please choose a name.");
  showPlayerQuestion();
}

function showPlayerQuestion() {
  document.getElementById("screen1").classList.add("hidden");
  document.getElementById("screen2").classList.remove("hidden");

  const q = questions[currentIndex];
  const isImposter = Math.floor(Math.random() * players.length) === players.indexOf(playerName);

  document.getElementById("questionNumber").textContent = currentIndex + 1;
  document.getElementById("playerQuestionEn").textContent = isImposter ? q.imposter : q.common;
  document.getElementById("playerQuestionMk").textContent = isImposter ? q.imposterMk : q.mk;
}

function revealShared() {
  document.getElementById("screen2").classList.add("hidden");
  document.getElementById("screen3").classList.remove("hidden");

  const q = questions[currentIndex];
  document.getElementById("sharedQuestionEn").textContent = q.common;
  document.getElementById("sharedQuestionMk").textContent = q.mk;
}

function nextRound() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    alert("Game Over! Thanks for playing.");
    location.reload();
    return;
  }
  showPlayerQuestion();
  document.getElementById("screen3").classList.add("hidden");
}
</script>

</body>
</html>
